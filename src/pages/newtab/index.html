<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'"
    />
    <meta name="color-scheme" content="dark" />
    <title>New Tab</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <main>
      <section class="hero">
        <div id="clock" class="clock"></div>
        <div id="greeting" class="greeting"></div>
      </section>

      <form id="search" class="search" autocomplete="off">
        <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.25" /><path d="M10.2 10.2L13.5 13.5" /></svg>
        <input id="q" type="text" placeholder="Search" spellcheck="false" autocomplete="off" />
        <div id="suggest" class="suggest" hidden></div>
      </form>

      <section class="favorites">
        <div id="favorites" class="grid"></div>
      </section>
    </main>

    <dialog id="add-dialog">
      <form id="add-form" method="dialog">
        <h2>Add Favorite</h2>
        <label>Name<input id="add-title" type="text" placeholder="Optional" /></label>
        <label>Address<input id="add-url" type="text" placeholder="example.com" required /></label>
        <div class="dialog-actions">
          <button type="button" id="add-cancel" class="secondary">Cancel</button>
          <button type="submit" class="primary">Add</button>
        </div>
      </form>
    </dialog>

    <script src="newtab.js"></script>
  </body>
</html>
