<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Glasswing</title>
    <link rel="stylesheet" href="backdrop.css" />
  </head>
  <body>
    <div id="tint"></div>
    <div id="glow"></div>
    <div id="grain"></div>
    <div id="card"></div>
    <div id="pane-left" class="pane"></div>
    <div id="pane-right" class="pane"></div>
    <div id="side-panel"><div id="side-panel-header"><span id="side-panel-title"></span><button id="side-panel-close" title="Close side panel" aria-label="Close side panel"><svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg></button></div></div>
    <div id="side-panel-edge" title="Drag to resize"></div>
    <div id="divider" title="Drag to resize. Double-click to even out. Right-click to separate or swap."></div>
    <script src="backdrop.js"></script>
  </body>
